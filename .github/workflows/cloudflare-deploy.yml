name: Testar e publicar STUDIO29 CORE
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio29-core-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - run: npm ci
      - run: npm test
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir configuração de produção
        run: test -f wrangler.toml -o -f wrangler.jsonc -o -f wrangler.json
      - name: Publicar no Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test da URL pública
        run: node scripts/smoke.mjs
        env:
          SMOKE_URL: ${{ vars.STUDIO29_SMOKE_URL }}
      - name: Registrar commit publicado
        run: echo "Publicado $GITHUB_SHA em $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
